apiVersion: migration.openshift.io/v1alpha1
kind: VmwareCloudFoundationMigration
metadata:
  labels:
    app.kubernetes.io/name: vcf-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: cluster
spec:
  state: Pending
  migrateStorage: true
  targetVCenterCredentialsSecret:
    name: target-vcenter-creds
    namespace: openshift-vcf-migration
  
  # nodeMigration controls the selected node-migration API shape.
  # Omitting it retains the legacy MachineSet/CPMS replacement path.
  #
  # Legacy IPI cluster — omit nodeMigration, or set both roles to Recreate:
  # nodeMigration:
  #   workers:
  #     type: Recreate
  #   controlPlane:
  #     type: Recreate
  #
  # VMotion API shape only; backend execution is not implemented.
  # For VMotion, remove topology.template from failureDomains and set the same
  # explicit mode for both roles. Auto and omitted mode are invalid.
  # nodeMigration:
  #   workers:
  #     type: VMotion
  #     vmotion:
  #       mode: Hot              # Hot | Cold
  #     maxUnavailable: 1
  #   controlPlane:
  #     type: VMotion
  #     vmotion:
  #       mode: Hot
  #     maxUnavailable: 1
  failureDomains:
    - name: target-fd-1
      region: target-region
      zone: target-zone-1
      server: vc01-lab2.devqe.ibmc.devcluster.openshift.com
      topology:
        datacenter: vsphere9-lab2-dc
        computeCluster: /vsphere9-lab2-dc/host/vsphere9-lab2-cluster
        datastore: /vsphere9-lab2-dc/datastore/vsanDatastore
        networks:
          - VM Network
        resourcePool: /vsphere9-lab2-dc/host/vsphere9-lab2-cluster/Resources
        template: /vsphere9-lab2-dc/vm/rhcos-9.8.20260428-0-vmware.x86_64
